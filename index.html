<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Lucky Spin - Earning Bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-deep: #0a0a12;
      --bg-mid: #14101f;
      --accent-gold: #f5b942;
      --accent-gold-2: #ffd97a;
      --accent-violet: #7b5cff;
      --accent-teal: #34e0c9;
      --text-dim: rgba(237, 233, 254, 0.55);
      --card-line: rgba(245, 185, 66, 0.18);
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% -10%, rgba(123, 92, 255, 0.35), transparent 55%),
        radial-gradient(circle at 85% 110%, rgba(52, 224, 201, 0.18), transparent 50%),
        var(--bg-deep);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: #f2eefc; padding: 24px;
    }

    .card {
      position: relative;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border: 1px solid var(--card-line);
      border-radius: 28px; padding: 34px 26px 28px;
      text-align: center; max-width: 360px;
      width: 100%; backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute; top: -60%; left: -20%;
      width: 140%; height: 140%;
      background: conic-gradient(from 90deg, rgba(245,185,66,0.08), transparent 30%, rgba(123,92,255,0.10), transparent 70%);
      animation: rotateGlow 14s linear infinite;
      pointer-events: none;
    }
    @keyframes rotateGlow { to { transform: rotate(360deg); } }

    .eyebrow {
      font-size: 20px;
      letter-spacing: 0.01em;
      color: var(--accent-teal);
      margin-bottom: 10px;
      font-weight: 800;
    }

    h1 {
      font-size: 26px; font-weight: 800; margin-bottom: 4px;
      background: linear-gradient(90deg, var(--accent-gold-2), var(--accent-gold));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      letter-spacing: -0.01em;
    }
    .subtitle { font-size: 13px; color: var(--text-dim); margin-bottom: 26px; }

    .wheel-wrapper {
      position: relative;
      width: 270px;
      height: 270px;
      margin: 6px auto 24px;
    }
    .wheel-glow {
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245,185,66,0.35), transparent 65%);
      filter: blur(6px);
      z-index: 0;
    }
    canvas {
      position: relative;
      z-index: 1;
      width: 100% !important;
      height: 100% !important;
      border-radius: 50%;
      box-shadow:
        0 0 0 3px var(--bg-mid),
        0 0 0 6px rgba(245, 185, 66, 0.6),
        0 12px 40px rgba(0,0,0,0.5);
    }
    #spinBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 66px;
      height: 66px;
      background: radial-gradient(circle at 35% 30%, var(--accent-gold-2), var(--accent-gold) 70%);
      border: 3px solid rgba(255,255,255,0.35);
      border-radius: 50%;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #241705;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6), inset 0 1px 3px rgba(255,255,255,0.6);
      z-index: 10;
      font-family: 'Segoe UI', sans-serif;
      transition: transform 0.15s ease;
    }
    #spinBtn:active { transform: translate(-50%, -50%) scale(0.92); }
    #spinBtn:disabled { opacity: 0.55; cursor: not-allowed; }

    .result-area {
      margin-top: 4px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px;
      padding: 16px;
      position: relative;
      z-index: 1;
    }
    .message { font-size: 14px; font-weight: 500; margin-bottom: 6px; line-height: 1.5; }
    .footer-note { font-size: 0.75rem; text-align: center; margin-top: 18px; color: rgba(237,233,254,0.45); position: relative; z-index: 1; }
  </style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Earning Buddy Bot</div>
  <h1>Spin & Win</h1>
  <p class="subtitle">One spin a day, one shot at the reward</p>

  <div class="wheel-wrapper">
    <div class="wheel-glow"></div>
    <canvas id="wheelCanvas" width="500" height="500"></canvas>
    <button id="spinBtn">SPIN</button>
  </div>

  <div class="result-area">
    <div class="message" id="resultMessage">✨ Tap SPIN and try your luck ✨</div>
  </div>
  <div class="footer-note">Daily limit: 1 spin • Come back tomorrow</div>
</div>

<script>
  /*
    Matches the ACTUAL backend contract in the bot code:
      GET /spin-reward?user_id=<id>&amount=<1-5>[&key=<SPIN_SECRET>]
      -> plain text: "OK" | "Already Claimed Today" | "Forbidden" |
                     "Not Verified" | "User Not Found" | "Rate Limited" | "Bad Request"

    Backend already:
      - clamps amount to the 1–5 range (server-side, can't be bypassed higher)
      - enforces "1 spin per day" ATOMICALLY (find_one_and_update), so even
        if this page is called twice, only one actually gets credited
      - checks banned / channel-verification status server-side

    Because the backend clamps any amount below 1 up to 1, this page must
    NEVER send an amount below ₹1 (a "₹0.5" or "₹0 — better luck" segment
    would incorrectly get force-credited as ₹1 by the clamp). So the losing
    segment is handled entirely client-side and never calls the backend.

    If you set SPIN_SECRET on the server, put the exact same value in
    SPIN_KEY below — otherwise leave it as "".
  */

  const BACKEND_URL = "https://earning-bot-2-ofkp.onrender.com";
  const SPIN_KEY = ""; // fill in only if SPIN_SECRET env var is set on the server

  // Only ₹1–₹5 are real backend-credited outcomes; "Try Again" never calls the server.
  const SEGMENTS = [
    { name: "₹1",  value: 1, isWin: true },
    { name: "₹2",  value: 2, isWin: true },
    { name: "₹1",  value: 1, isWin: true },
    { name: "₹3",  value: 3, isWin: true },
    { name: "Try Again", value: 0, isWin: false },
    { name: "₹5",  value: 5, isWin: true }
  ];

  const sliceAngle = 360 / SEGMENTS.length;
  const segmentsWithAngle = SEGMENTS.map((s, i) => ({
    ...s, start: i * sliceAngle, end: (i + 1) * sliceAngle, angle: sliceAngle
  }));

  const colors = ["#FF5252", "#FF8A65", "#FFD966", "#4CAF50", "#607D8B", "#2196F3"];

  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const spinBtn = document.getElementById('spinBtn');
  const msgDiv = document.getElementById('resultMessage');

  let spinning = false;
  let currentRotation = 0;
  let animFrame = null;

  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const urlParams = new URLSearchParams(window.location.search);
  const userId = urlParams.get('user_id');
  if (!userId) {
    msgDiv.innerHTML = "⚠️ Error: User ID missing. Restart bot.";
    spinBtn.disabled = true;
  }

  function drawWheel(rotationDeg = 0) {
    const size = canvas.width;
    const center = size / 2;
    const radius = center - 6;
    ctx.clearRect(0, 0, size, size);

    for (let i = 0; i < segmentsWithAngle.length; i++) {
      const seg = segmentsWithAngle[i];
      const startAng = seg.start + rotationDeg;
      const endAng = seg.end + rotationDeg;

      ctx.beginPath();
      ctx.moveTo(center, center);
      ctx.arc(center, center, radius, startAng * Math.PI / 180, endAng * Math.PI / 180);
      ctx.closePath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();

      ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.save();
      ctx.translate(center, center);
      ctx.rotate((startAng + seg.angle / 2) * Math.PI / 180);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = seg.name.length > 3 ? "800 18px 'Segoe UI', sans-serif" : "800 28px 'Segoe UI', sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
      ctx.shadowBlur = 4;
      ctx.fillText(seg.name, radius * 0.65, 0);
      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(center, center, radius, 0, 2 * Math.PI);
    ctx.strokeStyle = "#f5b942";
    ctx.lineWidth = 6;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(center, center, 32, 0, 2 * Math.PI);
    ctx.fillStyle = "rgba(10, 10, 18, 0.95)";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(center, center, 22, 0, 2 * Math.PI);
    ctx.fillStyle = "#f5b942";
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(center - 16, 8);
    ctx.lineTo(center, 28);
    ctx.lineTo(center + 16, 8);
    ctx.closePath();
    ctx.fillStyle = "#ff4d4d";
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.fill();
    ctx.stroke();
  }

  function getCurrentSegment(rotation) {
    const pointerAngle = (270 - (rotation % 360) + 360) % 360;
    for (let seg of segmentsWithAngle) {
      if (pointerAngle >= seg.start && pointerAngle < seg.end) return seg;
    }
    return segmentsWithAngle[0];
  }

  function easeOutQuint(t) { return 1 - Math.pow(1 - t, 5); }

  function spinWheel() {
    if (spinning || spinBtn.disabled) return;
    spinning = true;
    spinBtn.disabled = true;
    msgDiv.innerHTML = "🎡 Spinning...";

    const fullSpins = 5 + Math.floor(Math.random() * 3);
    const spinDeg = fullSpins * 360 + Math.random() * 360;
    const targetRotation = currentRotation + spinDeg;
    const startTime = performance.now();
    const duration = 4000;

    function animate(now) {
      const elapsed = now - startTime;
      const t = Math.min(1, elapsed / duration);
      const eased = easeOutQuint(t);
      drawWheel(currentRotation + spinDeg * eased);
      if (t < 1) {
        animFrame = requestAnimationFrame(animate);
      } else {
        currentRotation = targetRotation % 360;
        drawWheel(currentRotation);
        const winningSegment = getCurrentSegment(currentRotation);
        processReward(winningSegment); // button stays disabled until this finishes
      }
    }
    if (animFrame) cancelAnimationFrame(animFrame);
    animFrame = requestAnimationFrame(animate);
  }

  async function processReward(segment) {
    // "Try Again" slice never calls the backend — clamp would force a ₹1
    // credit otherwise, which is wrong for a losing spin.
    if (!segment.isWin) {
      msgDiv.innerHTML = "😔 Better luck next time!";
      spinning = false;
      // Backend still only allows 1 spin/day, but since we never called it,
      // it doesn't know this user "used" their spin. So we still let them
      // hit the actual reward endpoint with a real amount below, OR simplest:
      // keep button disabled for the rest of today's session to match the
      // "1 spin/day" promise shown in the UI.
      spinBtn.disabled = true;
      return;
    }

    const amt = segment.value; // always 1-5, matches backend's clamp range
    msgDiv.innerHTML = `🎉 You won ₹${amt}! Adding to your wallet...`;

    try {
      let url = `${BACKEND_URL}/spin-reward?user_id=${encodeURIComponent(userId)}&amount=${amt}`;
      if (SPIN_KEY) url += `&key=${encodeURIComponent(SPIN_KEY)}`;
      const res = await fetch(url, { method: "GET" });
      const text = (await res.text()).trim();

      if (res.status === 429) {
        msgDiv.innerHTML = "⏳ Too many attempts — wait a bit and reopen from the bot.";
        spinBtn.disabled = false; // transient, safe to retry
      } else if (text === "OK") {
        msgDiv.innerHTML = `✅ ₹${amt} added to your wallet! 🎊`;
        spinBtn.disabled = true; // spin used for today
      } else if (text === "Already Claimed Today") {
        msgDiv.innerHTML = "✅ You've already used today's spin. Come back tomorrow!";
        spinBtn.disabled = true;
      } else if (text === "Not Verified") {
        msgDiv.innerHTML = "⚠️ Please join the required channel first, then reopen from the bot.";
        spinBtn.disabled = true;
      } else if (text === "Forbidden") {
        msgDiv.innerHTML = "🚫 Your account can't claim this reward.";
        spinBtn.disabled = true;
      } else {
        msgDiv.innerHTML = `⚠️ Server said: ${text || "unknown error"}. Try again from the bot.`;
        spinBtn.disabled = false;
      }
    } catch (e) {
      msgDiv.innerHTML = "⚠️ Network error. If your balance wasn't updated, reopen and try again.";
      spinBtn.disabled = false; // network failure, safe to retry — backend is idempotent per day
    } finally {
      spinning = false;
    }
  }

  spinBtn.addEventListener('click', spinWheel);
  drawWheel(0);
</script>
</body>
</html>
