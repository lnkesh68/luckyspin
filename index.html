<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Lucky Spin - Earning Bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-deep: #0a0a12;
      --bg-mid: #14101f;
      --accent-gold: #f5b942;
      --accent-gold-2: #ffd97a;
      --accent-violet: #7b5cff;
      --accent-teal: #34e0c9;
      --text-dim: rgba(237, 233, 254, 0.55);
      --card-line: rgba(245, 185, 66, 0.18);
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% -10%, rgba(123, 92, 255, 0.35), transparent 55%),
        radial-gradient(circle at 85% 110%, rgba(52, 224, 201, 0.18), transparent 50%),
        var(--bg-deep);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: #f2eefc; padding: 24px;
    }

    .card {
      position: relative;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border: 1px solid var(--card-line);
      border-radius: 28px; padding: 34px 26px 28px;
      text-align: center; max-width: 360px;
      width: 100%; backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute; top: -60%; left: -20%;
      width: 140%; height: 140%;
      background: conic-gradient(from 90deg, rgba(245,185,66,0.08), transparent 30%, rgba(123,92,255,0.10), transparent 70%);
      animation: rotateGlow 14s linear infinite;
      pointer-events: none;
    }
    @keyframes rotateGlow { to { transform: rotate(360deg); } }

    .eyebrow {
      font-size: 20px;
      letter-spacing: 0.01em;
      color: var(--accent-teal);
      margin-bottom: 10px;
      font-weight: 800;
    }

    h1 {
      font-size: 26px; font-weight: 800; margin-bottom: 4px;
      background: linear-gradient(90deg, var(--accent-gold-2), var(--accent-gold));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      letter-spacing: -0.01em;
    }
    .subtitle { font-size: 13px; color: var(--text-dim); margin-bottom: 26px; }

    /* wheel container */
    .wheel-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 6px auto 24px;
    }
    .wheel-glow {
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245,185,66,0.35), transparent 65%);
      filter: blur(6px);
      z-index: 0;
    }
    canvas {
      position: relative;
      z-index: 1;
      width: 100% !important;
      height: 100% !important;
      border-radius: 50%;
      box-shadow:
        0 0 0 3px var(--bg-mid),
        0 0 0 6px rgba(245, 185, 66, 0.6),
        0 12px 40px rgba(0,0,0,0.5);
    }
    #spinBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 66px;
      height: 66px;
      background: radial-gradient(circle at 35% 30%, var(--accent-gold-2), var(--accent-gold) 70%);
      border: 3px solid rgba(255,255,255,0.35);
      border-radius: 50%;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #241705;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6), inset 0 1px 3px rgba(255,255,255,0.6);
      z-index: 10;
      font-family: 'Segoe UI', sans-serif;
      transition: transform 0.15s ease;
    }
    #spinBtn:active { transform: translate(-50%, -50%) scale(0.92); }
    #spinBtn:disabled { opacity: 0.55; cursor: not-allowed; }

    .info {
      font-size: 12px; color: var(--text-dim);
      margin-bottom: 22px; line-height: 1.7;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px; padding: 14px 16px;
      text-align: left;
      position: relative;
      z-index: 1;
    }
    .info b { color: #f2eefc; }

    .result-area {
      margin-top: 4px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px;
      padding: 16px;
      position: relative;
      z-index: 1;
    }
    .message {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      line-height: 1.5;
    }
    .btn-ad {
      background: linear-gradient(135deg, var(--accent-teal), #22b6a2);
      border: none;
      padding: 11px 18px;
      border-radius: 40px;
      color: #04231e;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
      margin-top: 6px;
      box-shadow: 0 6px 16px rgba(52, 224, 201, 0.25);
    }
    .btn-ad:active { transform: scale(0.97); }

    .footer-note {
      font-size: 0.7rem; text-align: center; margin-top: 18px;
      color: rgba(237,233,254,0.35);
      position: relative; z-index: 1;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Earning Buddy Bot</div>
  <h1>Spin & Win</h1>
  <p class="subtitle">One spin a day, one shot at the jackpot</p>

  <div class="wheel-wrapper">
    <div class="wheel-glow"></div>
    <canvas id="wheelCanvas" width="500" height="500"></canvas>
    <button id="spinBtn">SPIN</button>
  </div>

  <div class="info">
    🎁 <b>Rewards:</b> ₹0.5, ₹1, ₹2, ₹3, ₹5<br/>
    ⚡ <b>Better odds:</b> ₹0.5, ₹1, ₹2<br/>
    🎯 <b>Rare:</b> ₹3, ₹5
  </div>

  <div class="result-area">
    <div class="message" id="resultMessage">✨ Tap SPIN and try your luck ✨</div>
    <div id="extraAction"></div>
  </div>
  <div class="footer-note">Daily limit: 1 spin • Come back tomorrow</div>
</div>

<script>
  // --------------------------------------------------------------
  // Rewards with WEIGHTED probability (higher weight = more common)
  // --------------------------------------------------------------
  const SEGMENTS = [
    { name: "₹0.5", value: 0.5, type: "cash", weight: 30 },
    { name: "₹1",   value: 1,   type: "cash", weight: 25 },
    { name: "₹2",   value: 2,   type: "cash", weight: 20 },
    { name: "₹3",   value: 3,   type: "cash", weight: 15 },
    { name: "₹5",   value: 5,   type: "cash", weight: 10 }
  ];

  // Calculate angles based on weight
  let totalWeight = SEGMENTS.reduce((s, seg) => s + seg.weight, 0);
  let segmentsWithAngle = [];
  let start = 0;
  for (let seg of SEGMENTS) {
    let angle = (seg.weight / totalWeight) * 360;
    segmentsWithAngle.push({
      ...seg,
      start: start,
      end: start + angle,
      angle: angle
    });
    start += angle;
  }

  // Colors (distinct, vibrant palette - one clear color per slice, like before)
  const colors = ["#FF5252", "#FF8A65", "#FFD966", "#4CAF50", "#2196F3"];
  let segmentColors = segmentsWithAngle.map((_,i) => colors[i % colors.length]);

  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  let spinning = false;
  let currentRotation = 0;
  let animFrame = null;

  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  // get user_id from URL
  const urlParams = new URLSearchParams(window.location.search);
  const userId = urlParams.get('user_id');
  if (!userId) {
    document.getElementById('resultMessage').innerHTML = "⚠️ Error: User ID missing. Restart bot.";
  }

  // Backend URL (same as your bot's domain - Railway)
  const BACKEND_URL = "https://earning-bot-production.up.railway.app";

  function drawWheel(rotationDeg = 0) {
    const size = canvas.width;
    const center = size/2;
    const radius = center - 6;
    ctx.clearRect(0, 0, size, size);
    for (let i=0; i<segmentsWithAngle.length; i++) {
      const seg = segmentsWithAngle[i];
      const startAng = seg.start + rotationDeg;
      const endAng = seg.end + rotationDeg;
      ctx.beginPath();
      ctx.moveTo(center, center);
      ctx.arc(center, center, radius, startAng * Math.PI/180, endAng * Math.PI/180);
      ctx.closePath();
      ctx.fillStyle = segmentColors[i];
      ctx.fill();
      ctx.save();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(10,10,18,0.85)";
      ctx.lineWidth = 2;
      ctx.stroke();
      // text
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate((startAng + seg.angle/2) * Math.PI/180);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 16px 'Segoe UI'";
      ctx.fillStyle = "#1f1f1f";
      ctx.fillText(seg.name, radius * 0.7, 6);
      ctx.restore();
    }
    // center circle
    ctx.beginPath();
    ctx.arc(center, center, 24, 0, 2*Math.PI);
    ctx.fillStyle = "rgba(20,16,31,0.9)";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(center, center, 17, 0, 2*Math.PI);
    ctx.fillStyle = "#f5b942";
    ctx.fill();
    // pointer at top
    ctx.beginPath();
    ctx.moveTo(center-13, 14);
    ctx.lineTo(center, 0);
    ctx.lineTo(center+13, 14);
    ctx.fillStyle = "#ffd97a";
    ctx.fill();
  }

  // Whichever number the pointer stops on is the winner - the spin distance is
  // random, not the outcome. Long spin-up + slow deceleration for a real wheel feel.
  function getCurrentSegment(rotation) {
    const pointerAngle = (360 - (rotation % 360)) % 360;
    for (let seg of segmentsWithAngle) {
      if (pointerAngle >= seg.start && pointerAngle < seg.end) return seg;
    }
    return segmentsWithAngle[0];
  }

  function easeOutQuint(t) { return 1 - Math.pow(1 - t, 5); }

  function spinWheel() {
    if (spinning) return;
    spinning = true;
    const spinBtn = document.getElementById('spinBtn');
    spinBtn.disabled = true;

    const fullSpins = 6 + Math.floor(Math.random() * 3); // 6-8 full rotations
    const spinDeg = fullSpins * 360 + Math.random() * 360; // random landing spot
    const targetRotation = currentRotation + spinDeg;

    const startTime = performance.now();
    const duration = 4200; // long spin-up + slow, realistic deceleration

    function animate(now) {
      const elapsed = now - startTime;
      let t = Math.min(1, elapsed / duration);
      const eased = easeOutQuint(t);
      const newRot = currentRotation + spinDeg * eased;
      drawWheel(newRot);
      if (t < 1) {
        animFrame = requestAnimationFrame(animate);
      } else {
        currentRotation = targetRotation % 360;
        drawWheel(currentRotation);
        const winningSegment = getCurrentSegment(currentRotation);
        spinning = false;
        spinBtn.disabled = false;
        processReward(winningSegment);
      }
    }
    if (animFrame) cancelAnimationFrame(animFrame);
    animFrame = requestAnimationFrame(animate);
  }

  async function processReward(segment) {
    const msgDiv = document.getElementById('resultMessage');
    const extraDiv = document.getElementById('extraAction');
    extraDiv.innerHTML = '';
    if (segment.type === "cash") {
      const amt = segment.value;
      msgDiv.innerHTML = `🎉 Congrats! You won ₹${amt}! 🎉<br>Adding to your wallet...`;
      try {
        const url = `${BACKEND_URL}/spin-reward?user_id=${userId}&amount=${amt}`;
        const res = await fetch(url);
        if (res.ok) {
          msgDiv.innerHTML = `✅ ₹${amt} added to your wallet! 🎊`;
        } else {
          msgDiv.innerHTML = `⚠️ Server error. Please try again later.`;
        }
      } catch(e) {
        msgDiv.innerHTML = `⚠️ Network error. Reward wasn't saved.`;
      }
    }
    else if (segment.type === "ads") {
      msgDiv.innerHTML = `🎁 You got an Ads Task! 🎁<br>Watch an ad and get ₹5-₹7 instantly!`;
      const adUrl = `${BACKEND_URL}/ad?uid=${userId}&lang=en`;
      const btn = document.createElement('button');
      btn.innerText = "▶️ Watch Ad & Earn";
      btn.className = "btn-ad";
      btn.onclick = () => { tg.openLink(adUrl); };
      extraDiv.appendChild(btn);
    }
  }

  document.getElementById('spinBtn').addEventListener('click', spinWheel);
  drawWheel(0);
</script>
</body>
</html>
